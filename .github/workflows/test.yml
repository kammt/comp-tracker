name: Tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners come with Google Chrome, so no browser is downloaded here.
      - run: npm test
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
